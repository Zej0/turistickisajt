<!DOCTYPE html>
<html lang="sr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Kontaktirajte nas - Turistički vodič za Beograd.">
        <title>Kontakt</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <!-- Navigacija -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">Beograd Vodič</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Početna</a></li>
                        <li class="nav-item"><a class="nav-link" href="atrakcije.html">Atrakcije</a></li>
                        <li class="nav-item"><a class="nav-link" href="hrana.html">Hrana i piće</a></li>
                        <li class="nav-item"><a class="nav-link active" href="kontakt.html">Kontakt</a></li>
                        <li class="nav-item"><a class="nav-link" href="autor.html">O autoru</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Naslov -->
        <div class="container my-5 text-center">
            <h1>Kontakt</h1>
            <p class="lead">Imate pitanja ili želite preporuke? Pošaljite nam poruku!</p>
        </div>

        <!-- Kontakt forma -->
        <div class="container mb-5">
            <div class="row justify-content-center">
                <div class="col-sm-12 col-md-8 col-lg-6">
                    <form>
                        <div class="mb-3">
                            <label for="ime" class="form-label">Ime i prezime</label>
                            <input type="text" class="form-control" id="ime" placeholder="Unesite vaše ime" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email adresa</label>
                            <input type="email" class="form-control" id="email" placeholder="primer@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="poruka" class="form-label">Poruka</label>
                            <textarea class="form-control" id="poruka" rows="5" placeholder="Napišite svoju poruku..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Pošalji</button>
                    </form>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <footer class="bg-dark text-white text-center py-3">
            <p>© 2025 Turistički vodič za Beograd</p>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
